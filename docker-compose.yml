version: '3.8'

services:
  soc-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: soc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql://soc_user:soc_password@postgres:5432/soc_db
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      # External AI / LLM Configuration (OpenAI, Groq, External Ollama, vLLM, etc.)
      - LLM_PROVIDER=openai
      - LLM_API_BASE=https://api.openai.com/v1
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=gpt-4o-mini
      - LLM_ENABLED=false
    depends_on:
      - postgres
      - redis
      - elasticsearch
      - neo4j

  soc-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: soc-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - soc-api

  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=soc_user
      - POSTGRES_PASSWORD=soc_password
      - POSTGRES_DB=soc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: soc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: soc-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  neo4j:
    image: neo4j:5.16-community
    container_name: soc-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/socpassword123
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  redis_data:
  es_data:
  neo4j_data:
